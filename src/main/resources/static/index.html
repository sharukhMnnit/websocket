<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Chat - WebRTC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/main.css">
    <script src="https://webrtc.github.io/adapter/adapter-latest.js"></script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">

    <script>
        const token = localStorage.getItem('jwtToken');
        if (!token) window.location.href = '/login.html';
    </script>

    <!-- ================= VIDEO CALL STYLES (UPDATED ONLY THIS) ================= -->
 <style>
        /* 1. The Main Floating Window */
        #video-overlay {
            display: none;
            position: fixed; /* Fixed = stays on screen when scrolling */
            top: 15%;
            left: 50%;
            transform: translateX(-50%); /* Centers it perfectly */
            width: 700px; /* Wider for side-by-side */
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            border: 1px solid #444;
            border-radius: 12px;
            padding: 15px;
            z-index: 99999; /* Super high z-index */
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            text-align: center;
        }

        /* The Drag Handle */
        #video-overlay h4 {
            margin: 0 0 15px;
            color: #ddd;
            cursor: move;
            font-family: sans-serif;
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* 2. Side-by-Side Grid Container */
        .video-grid {
            display: flex !important; /* Force Flexbox */
            flex-direction: row !important; /* Force Row */
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* 3. The Videos (FORCE Equal Size) */
        video {
            width: 50% !important; /* Override main.css */
            height: 250px !important; /* Fixed height for uniformity */
            position: static !important; /* Remove absolute positioning from main.css */
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #333;
            background: #000;
        }

        /* Specific fix for Local Video to kill the '80px' bug */
        #localVideo {
            transform: scaleX(-1);
            border-color: #3498db; /* Blue border for you */
            margin: 0 !important;
        }

        #remoteVideo {
            border-color: #e74c3c; /* Red border for them */
        }

        /* Controls */
        .video-controls { margin-top: 15px; }
        .video-controls button {
            background: #e74c3c; color: white; border: none;
            padding: 10px 30px; border-radius: 30px;
            cursor: pointer; font-size: 1rem; font-weight: bold;
            transition: 0.2s;
        }
        .video-controls button:hover { background: #c0392b; transform: scale(1.05); }
    </style>
</head>

<body>

<div class="user-list-container">
    <div class="user-list-header">
        <h3>Nexus Chat</h3>
        <input type="text" id="userSearch" placeholder="Search..." onkeyup="searchUsers()" autocomplete="off">

        <div class="tab-container">
            <button onclick="showChatTab()" class="tab-btn active-tab" id="btn-chats">Chats</button>
            <button onclick="showRequestsTab()" class="tab-btn inactive-tab" id="btn-requests">
                Requests <span id="req-badge" class="unread-badge">0</span>
            </button>
        </div>
    </div>

    <ul id="usersList" class="user-list"></ul>
    <ul id="searchResults" class="user-list" style="display:none;"></ul>
    <ul id="requestList" class="user-list" style="display:none;"></ul>
</div>

<div class="chat-container">
    <div class="chat-header">
        <h2 id="chat-title">Select a friend</h2>

        <div class="header-actions" style="display:flex;align-items:center;">
            <span style="margin-right:15px;color:#777;font-size:0.9em;">
                Logged in as: <b id="current-user-display">...</b>
            </span>

            <button id="btnCall" class="btn-call" onclick="startVideoCall()">📹 Video Call</button>

            <button onclick="logout()"
                style="background:#e74c3c;color:white;border:none;padding:5px 10px;border-radius:4px;cursor:pointer;">
                Logout
            </button>
        </div>
    </div>

    <!-- ================= VIDEO OVERLAY ================= -->
    <div id="video-overlay">
        <h4>Video Call</h4>

        <div class="video-grid">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>

        <div class="video-controls">
            <button onclick="endCall()">End Call</button>
        </div>
    </div>

    <ul id="messageArea">
        <div style="text-align:center;margin-top:50px;color:#777;">
            <h3>Welcome</h3>
            <p>Select a user to chat or call.</p>
        </div>
    </ul>

    <form id="messageForm" class="message-input-area">
        <label for="fileInput" class="file-upload-label">📎</label>
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileSelect(this)">

        <input type="text" id="message" placeholder="Type a message..." autocomplete="off">
        <button type="submit" class="btn-send">Send</button>
    </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/main.js"></script>

<script>
    document.getElementById('current-user-display').innerText =
        localStorage.getItem('username');

    function logout() {
        localStorage.clear();
        window.location.href = '/login.html';
    }
</script>

</body>
</html>
